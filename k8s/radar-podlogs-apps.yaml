# Radar MCP ходит только в namespace apps: логи диагностируемых приложений.
#
# ClusterRole чарта даёт pods/log глобально, из-за чего слабая модель через
# Radar MCP читала бы логи собственного пода Holmes (namespace holmes), где в
# stdout попадает финальный ответ. Чарт не умеет namespace-scoped pods/log,
# поэтому cluster-wide правило отключено (rbac.podLogs=false в helm-релизе),
# а здесь выдаётся Role/RoleBinding только на namespace apps.
#
# Применять:
#   helm upgrade --install radar ... --set rbac.podLogs=false
#   kubectl apply -f k8s/radar-podlogs-apps.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-podlogs
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-podlogs
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radar-podlogs
subjects:
  - kind: ServiceAccount
    name: radar
    namespace: radar
